[package]
name = "screen-qr-reader"
version = "0.1.0"
authors = ["mutoxu=N <55544957+mutoxu-N@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
dioxus = { version = "0.7.1", features = [] }
image = "0.25.10"
open = "5.3.5"
rqrr = "0.10.1"
xcap = "0.9.4"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
