[package]
name = "screen-qr-reader"
version = "0.1.0"
authors = ["mutoxu=N <55544957+mutoxu-N@users.noreply.github.com>"]
edition = "2021"

[dependencies]
arboard = "3.6.1"
eframe = "0.37.0"
egui = "0.37.0"
global-hotkey = "0.7"
image = "0.25.10"
open = "5.3.5"
rqrr = "0.10.1"
tray-icon = "0.21"
xcap = "0.9.4"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

