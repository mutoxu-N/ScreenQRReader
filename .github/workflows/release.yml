name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sqrr.exe
            bin_ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: sqrr
            bin_ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sqrr
            bin_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libwayland-dev \
            libgbm-dev \
            libdrm-dev \
            libfontconfig-dev \
            libpipewire-0.3-dev \
            libclang-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "sqrr-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.bin_ext }}"

      - name: Prepare release binary (Unix)
        if: runner.os != 'Windows'
        run: |
          OUT="sqrr-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$OUT"
          chmod +x "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: sqrr-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.bin_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
